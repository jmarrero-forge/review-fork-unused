# An agent's review of every pull request here, through jmarrero-forge/
# actions' jmarrero-review.yml pinned by commit (agentic-job's
# docs/review.md, "Another repository"): agentic-job's own review.yml joins
# cgwalters' tailnet, which has no entry for jmarrero. The wrapper reads its
# bounds (workflow/review.toml, workflow/review-command.toml) and its task
# (workflow/review.md) from this repository's base branch.
# Off until the repository variable AGENT_REVIEW names the reviewing
# agent: the wrapper has no fallback agent or broker.
name: review
on:
  # The base's reusable workflow runs; no step here checks out or runs the
  # head (test/reviewgate.test.ts enforces that), so this trigger is accepted.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      vars.AGENT_REVIEW != '' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    # de62d4a is on jmarrero-forge/actions main, the commit the broker's
    # run-token policy (atomic-setup) names for this repository; move it
    # together with that.
    uses: jmarrero-forge/actions/.github/workflows/jmarrero-review.yml@de62d4a1cd93433538c59cf8d18bb1dbe39ce180
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
